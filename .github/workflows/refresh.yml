name: Refresh dashboard data

on:
  workflow_dispatch:
  schedule:
    - cron: '15 11 * * 1'
    - cron: '30 11 1 * *'

permissions:
  contents: write

jobs:
  refresh:
    name: Refresh and publish dashboard data
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Refresh public sources
        run: python scripts/refresh.py

      - name: Validate dashboard data
        run: python scripts/validate.py

      - name: Commit refreshed data
        shell: bash
        run: |
          git config user.name "dashboard-refresh-bot"
          git config user.email "dashboard-refresh-bot@users.noreply.github.com"
          git add data/dashboard-data.json
          git diff --cached --quiet || git commit -m "Automated dashboard refresh"
          git push
