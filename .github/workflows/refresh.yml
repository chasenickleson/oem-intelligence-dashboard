name: Refresh dashboard data

on:
  workflow_dispatch:

  schedule:
    - cron: '15 11 * * 1'
    - cron: '30 11 1 * *'

permissions:
  contents: write

jobs:
  refresh:
    name: Refresh and publish dashboard data
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh public sources
        run: python scripts/refresh.py

      - name: Validate generated data
        run: python scripts/validate.py

      - name: Commit updated dashboard data
        shell: bash
        run: |
          git config user.name "dashboard-refresh-bot"
          git config user.email "dashboard-refresh-bot@users.noreply.github.com"
          git add data/dashboard-data.json

          if git diff --cached --quiet; then
            echo "No dashboard data changes to commit."
          else
            git commit -m "Automated dashboard refresh"
            git push
          fi
