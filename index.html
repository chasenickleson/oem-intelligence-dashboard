<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OEM Intelligence Dashboard</title><style>
:root{--r:#cd163f;--o:#f58025;--bg:#f5f7fa;--ink:#172033;--b:#e2e8f0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Arial,sans-serif}.wrap{max-width:1350px;margin:auto;padding:0 20px}.top{background:#171717;color:#fff;border-bottom:4px solid var(--r);padding:16px 0}.hero{margin:22px 0;padding:30px;border-radius:22px;background:#1d1d1d;color:#fff}.hero h1{font-size:42px;margin:8px 0}.meta{display:flex;gap:10px;flex-wrap:wrap}.pill{background:#ffffff12;padding:7px 10px;border-radius:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#fff;border:1px solid var(--b);border-radius:16px;padding:20px}.score{font-size:46px;font-weight:900}.btn{border:0;border-radius:9px;padding:9px 12px;background:var(--r);color:#fff;font-weight:800;cursor:pointer}.details{margin:18px 0}.news{padding:12px 0;border-top:1px solid var(--b)}a{color:#1557a0}.warn{background:#fff5d6;border:1px solid #f4d66b;padding:12px;border-radius:10px;margin-top:12px}.hidden{display:none}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.grid{grid-template-columns:1fr}.hero h1{font-size:32px}}
</style></head><body><header class="top"><div class="wrap"><b>RA · OEM Segment Portfolio Intelligence</b></div></header><main class="wrap"><section class="hero"><div>LIVE PROOF OF CONCEPT</div><h1>OEM Intelligence Dashboard</h1><p>Loads the newest published JSON whenever opened. GitHub Actions refreshes source content on schedule.</p><div class="meta"><span class="pill">Intelligence refreshed: <b id="refreshed">Loading…</b></span><span class="pill">Dashboard opened: <b id="opened"></b></span></div><div id="stale" class="warn hidden"></div></section><section id="cards" class="grid"></section><section id="detail" class="card details"><h2>Select a segment</h2></section></main><script>
let DATA; const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmt(d){return new Date(d).toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'})}
async function load(){document.getElementById('opened').textContent=new Date().toLocaleString();const r=await fetch('./data/dashboard-data.json?v='+Date.now());if(!r.ok)throw Error('Unable to load dashboard data');DATA=await r.json();document.getElementById('refreshed').textContent=fmt(DATA.last_refreshed);const age=(Date.now()-new Date(DATA.last_refreshed))/86400000;if(age>35){const w=document.getElementById('stale');w.classList.remove('hidden');w.textContent='Refresh is overdue. The dashboard is showing the last successful dataset.'}const entries=Object.entries(DATA.segments);document.getElementById('cards').innerHTML=entries.map(([k,s])=>`<article class="card"><h3>${esc(s.name)}</h3><div><span class="score">${esc(s.score)}</span> · <b>${esc(s.label)}</b></div><p>${esc(s.summary)}</p><button class="btn" onclick="showSeg('${k}')">Open segment</button></article>`).join('');showSeg(entries[0][0])}
function showSeg(k){const s=DATA.segments[k];document.getElementById('detail').innerHTML=`<h2>${esc(s.name)}</h2><h3>What leaders are talking about</h3>${s.leaders.map(x=>`<p>• ${esc(x)}</p>`).join('')}<h3>Curated public newsroom</h3>${s.news.length?s.news.map(n=>`<div class="news"><b>${esc(n.title)}</b><br><span>${esc(n.source)} · ${esc(n.published)}</span><br><a href="${esc(n.url)}" target="_blank" rel="noopener">Read original source ↗</a></div>`).join(''):'<p>No fresh articles were returned in the last run. The last valid dashboard data remains available.</p>'}`;document.getElementById('detail').scrollIntoView({behavior:'smooth'})}
load().catch(e=>{document.getElementById('cards').innerHTML='<div class="warn">'+esc(e.message)+'. Confirm GitHub Pages is enabled and dashboard-data.json exists.</div>'});
</script></body></html>
